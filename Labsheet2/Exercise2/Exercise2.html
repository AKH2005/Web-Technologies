<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Audio and Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>HTML5 Multimedia Page</h1>

<h2>🎵 Audio Player</h2>
<audio id="audioPlayer" controls>
    <source src="audio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
<div class="time">Current Time: <span id="audioTime">0:00</span></div>

<h2>🎬 Video Player</h2>
<video id="videoPlayer" controls>
    <source src="weekend.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>
<div class="time">Current Time: <span id="videoTime">0:00</span></div>

<script src="script.js"></script>
</body>
</html>
