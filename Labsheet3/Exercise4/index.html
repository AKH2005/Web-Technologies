<!DOCTYPE html>
<html>
<head>
  <title>Real-Time User Activity Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Real-Time User Activity Monitor</h2>

<div class="monitor-area">
  <button id="testButton">Click Me</button>
  <input id="testInput" placeholder="Type something...">
  <textarea id="testTextarea" placeholder="Focus here..."></textarea>
</div>

<h3>Activity Log</h3>
<div id="logBox"></div>

<div class="actions">
  <button id="resetBtn">Reset Log</button>
  <button id="exportBtn">Export Log</button>
</div>

<p id="warning"></p>

<script src="script.js"></script>
</body>
</html>
