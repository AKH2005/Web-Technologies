<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Registration</title>
	</head>
	<body>
		<center>
			<table border="0" cellpadding="6" cellspacing="8" width="520">
				<tr>
					<td align="center"><h2>Registration</h2></td>
				</tr>
				<tr>
					<td>
						<form action="#" method="post" enctype="multipart/form-data">
							<table align="center" border="0" cellpadding="6" cellspacing="6">
								<tr>
									<td align="right"><label for="fullname">Full Name:</label></td>
									<td align="left"><input type="text" id="fullname" name="fullname" required size=" thirty"></td>
								</tr>

								<tr>
									<td align="right"><label for="email">Email:</label></td>
									<td align="left"><input type="email" id="email" name="email" required size="30"></td>
								</tr>

								<tr>
									<td align="right"><label for="dob">Date of Birth:</label></td>
									<td align="left"><input type="date" id="dob" name="dob" required></td>
								</tr>

								<tr>
									<td align="right"><label for="phone">Phone:</label></td>
									<td align="left"><input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890" required></td>
								</tr>

								<tr>
									<td align="right"><label for="password">Password:</label></td>
									<td align="left"><input type="password" id="password" name="password" minlength="6" required></td>
								</tr>

								<tr>
									<td align="right"><label for="profile">Profile Pic:</label></td>
									<td align="left"><input type="file" id="profile" name="profile" accept="image/*"></td>
								</tr>

								<tr>
									<td></td>
									<td align="left"><input type="checkbox" id="terms" name="terms" required> <label for="terms">Accept Terms</label></td>
								</tr>

								<tr>
									<td colspan="2" align="center">
										<input type="submit" value="Register">&nbsp;&nbsp;
										<input type="reset" value="Clear">
									</td>
								</tr>
							</table>
						</form>
					</td>
				</tr>
			</table>
		</center>
	</body>
</html>
