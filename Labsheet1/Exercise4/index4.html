<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Product Card</title>
		<link rel="stylesheet" href="index4.css">
	</head>
	<body>
		<section style="display:flex;align-items:center;justify-content:center;padding:40px">
			<div class="card">
				<img src="https://th.bing.com/th/id/OIP.icG9O-OApH_E_t6mPv4akQHaGq?w=236&h=213&c=7&r=0&o=7&cb=ucfimg2&dpr=1.3&pid=1.7&rm=3&ucfimg=1" alt="Headphones" style="width:100%;height:200px;object-fit:cover;display:block">

				<div class="body">
					<h3>Wireless Noise‑Cancelling Headphones</h3>
					<p class="desc">Crisp audio, long battery life, and active noise cancellation for uninterrupted listening.</p>

					<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px">
						<div class="price">$149.00</div>
						<div class="rating">★ 4.6</div>
					</div>

					<div style="margin-top:12px">
						<button class="btn buy">Buy Now</button>
					</div>
				</div>
			</div>
		</section>
	</body>
</html>
